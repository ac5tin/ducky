name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-26.04
            args: --bundles appimage
          - platform: ubuntu-26.04-arm
            args: --bundles appimage
          - platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: set version from tag
        shell: bash
        run: |
          node -e "const fs=require('fs'); const v=process.env.GITHUB_REF_NAME.replace(/^v/,''); const j=p=>{const o=JSON.parse(fs.readFileSync(p,'utf8')); o.version=v; fs.writeFileSync(p, JSON.stringify(o,null,2)+'\n');}; j('package.json'); j('src-tauri/tauri.conf.json'); let t=fs.readFileSync('src-tauri/Cargo.toml','utf8'); t=t.replace(/^version = \"[^\"]+\"/m, 'version = \"'+v+'\"'); fs.writeFileSync('src-tauri/Cargo.toml', t); console.log('version', v);"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ducky ${{ github.ref_name }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: bundle Flatpak
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//47 org.gnome.Sdk//47
          cp src-tauri/target/release/ducky public/ducky.svg \
            src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/icon.png \
            flatpak/
          flatpak-builder --force-clean --repo=flatpak-repo fp-build flatpak/app.ducky.mcp.yml
          arch=$(uname -m)
          flatpak build-bundle flatpak-repo "Ducky-${TAG}-linux-${arch}.flatpak" app.ducky.mcp
          gh release upload "${TAG}" "Ducky-${TAG}-linux-${arch}.flatpak" --clobber
