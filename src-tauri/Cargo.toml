[package]
name = "ducky"
version = "0.1.0"
description = "Ducky — a friendly cross-platform MCP client"
authors = ["Ducky"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "ducky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "gzip", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2"
http = "1"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "elicitation",
    "request-state",
] }
sse-stream = "0.2"
portable-pty = "0.9.0"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "server",
    "transport-io",
    "macros",
    "schemars",
    "elicitation",
    "request-state",
] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
